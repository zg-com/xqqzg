<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我们的温馨小窝 🏠</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        :root { --primary: #6c5ce7; --bg: #f8f9fd; }
        body { margin: 0; padding: 0; font-family: 'PingFang SC', sans-serif; background: var(--bg); color: #2d3436; }
        
        .hero {
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            padding: 40px 20px; color: white; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px;
            box-shadow: 0 10px 20px rgba(161, 140, 209, 0.3); text-align: center; position: relative;
        }
        .hero h1 { margin: 0; font-size: 26px; }
        .hero p { opacity: 0.9; margin-top: 10px; font-size: 14px; }

        /* 隐藏的管理入口 */
        .admin-link {
            position: absolute; top: 15px; right: 15px;
            text-decoration: none; font-size: 20px; opacity: 0.5; cursor: pointer;
        }

        .container { max-width: 600px; margin: 0 auto; padding: 20px; }

        .nav-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;
            transform: translateY(-30px); margin-bottom: 0;
        }
        .nav-item {
            background: white; border-radius: 16px; padding: 15px 10px;
            text-align: center; text-decoration: none; color: #333;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); transition: 0.2s;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .nav-item:active { transform: scale(0.95); }
        .nav-icon { font-size: 28px; margin-bottom: 5px; }
        .nav-text { font-size: 13px; font-weight: bold; }

        .section-title { font-weight: bold; font-size: 18px; margin: 20px 0 15px; color: #636e72; }
        
        .goal-card {
            background: white; border-radius: 16px; padding: 20px;
            margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        .goal-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 15px; font-weight: bold; }
        .goal-val { color: var(--primary); font-family: monospace; }
        
        .progress-bg { height: 12px; background: #f1f2f6; border-radius: 6px; overflow: hidden; }
        .progress-bar { 
            height: 100%; border-radius: 6px; width: 0%; 
            transition: width 1.2s cubic-bezier(0.22, 0.61, 0.36, 1);
            background-image: linear-gradient(45deg,rgba(255,255,255,.15) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.15) 50%,rgba(255,255,255,.15) 75%,transparent 75%,transparent);
            background-size: 40px 40px;
        }
        
        .goal-footer { margin-top: 8px; font-size: 12px; color: #b2bec3; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div id="app">
    <div class="hero">
        <a href="unit/admin.html" class="admin-link">⚙️</a>
        <h1>Welcome Back ❤️</h1>
        <p>今天是爱你的第 {{ calculateDaysFrom('2025-09-25') }} 天</p>
    </div>

    <div class="container">
        <div class="nav-grid">
            <a href="unit/coupons.html" class="nav-item">
                <span class="nav-icon">🎟️</span><span class="nav-text">兑换券</span>
            </a>
            <a href="unit/decision.html" class="nav-item">
                <span class="nav-icon">🎡</span><span class="nav-text">帮我选</span>
            </a>
            <a href="unit/daoqian.html" class="nav-item">
                <span class="nav-icon">🥺</span><span class="nav-text">道歉</span>
            </a>
            <a href="/unit/period.html" class="nav-item">
                <span class="nav-icon">🩸</span><span class="nav-text">经期助手</span>
            </a>
            <a href="/unit/games.html" class="nav-item">
                <span class="nav-icon">🎮</span><span class="nav-text">游戏厅</span>
            </a>
        </div>

        <div class="section-title">📈 我们的成长计划</div>

        <div v-if="loading" style="text-align:center;color:#ccc;padding:20px;">数据加载中...</div>

        <div class="goal-card" v-for="goal in goals" :key="goal.id">
            <div class="goal-header">
                <span style="color:#2d3436">{{ goal.title }}</span>
                <span class="goal-val" :style="{color: goal.color || '#6c5ce7'}">
                    <template v-if="goal.type === 2">
                        在一起 {{ calculateDaysFrom(goal.startDate) }} 天
                    </template>
                    <template v-else>
                        {{ goal.currentVal }} / {{ goal.targetVal }} {{ goal.unit }}
                    </template>
                </span>
            </div>
            
            <div class="progress-bg">
                <div class="progress-bar" 
                     :style="{ 
                        width: getPercent(goal) + '%', 
                        backgroundColor: goal.color || '#6c5ce7' 
                     }">
                </div>
            </div>

            <div class="goal-footer">
                <template v-if="goal.type === 2">
                   <span>完成度: {{ getPercent(goal) }}%</span>
                   <span>目标: {{ goal.targetVal }} 天</span>
                </template>
                <template v-else>
                   <span>完成度: {{ getPercent(goal) }}%</span>
                   <span>目标: {{ goal.targetVal }} {{ goal.unit }}</span>
                </template>
            </div>
        </div>
    </div>
</div>

<script>
    const { createApp, ref, onMounted } = Vue;
    const API_BASE = 'http://zgnas.com.cn:18081';

    createApp({
        setup() {
            const goals = ref([]);
            const loading = ref(true);

            // 通用日期计算函数：计算 "从 dateStr 到今天" 过了多少天
            const calculateDaysFrom = (dateStr) => {
                if(!dateStr) return 0;
                const start = new Date(dateStr);
                const now = new Date();
                // 算出时间差(毫秒)，转成天数，向下取整
                const diff = Math.floor((now - start) / (1000 * 60 * 60 * 24));
                return diff < 0 ? 0 : diff; // 如果还没开始，显示0
            };

            const loadGoals = async () => {
                try {
                    const res = await fetch(`${API_BASE}/goals/list`);
                    goals.value = await res.json();
                } catch(e) { console.error("加载失败"); }
                loading.value = false;
            };

            const getPercent = (goal) => {
                if(!goal.targetVal) return 0;
                
                let current = 0;
                // 分类讨论当前值
                if (goal.type === 2) {
                    // 纪念日：当前值 = 算出来的天数
                    current = calculateDaysFrom(goal.startDate);
                } else {
                    // 累积型：当前值 = 数据库里的值
                    current = goal.currentVal || 0;
                }

                let p = (current / goal.targetVal) * 100;
                return p > 100 ? 100 : p.toFixed(1);
            };

            onMounted(loadGoals);

            return { goals, loading, getPercent, calculateDaysFrom };
        }
    }).mount('#app');
</script>
</body>
</html>
